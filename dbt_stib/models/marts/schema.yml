version: 2

models:
  - name: fct_collection_health
    description: "Santé de la collecte : polls reçus par heure locale (120 attendus, un toutes les 30 s). Un poll n'est détecté que s'il contient au moins un véhicule."
    columns:
      - name: local_hour
        data_tests: [unique, not_null]
      - name: polls_received
        data_tests: [not_null]
      - name: completeness_pct
        data_tests: [not_null]

  - name: fct_line_speeds
    description: "Vitesse commerciale (arrêts inclus) par ligne, direction et heure locale, calculée sur les temps de parcours entre arrêts consécutifs, tracés propres uniquement."
    columns:
      - name: lineid
        data_tests: [not_null]
      - name: direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['City', 'Suburb']
      - name: median_speed_kmh
        data_tests: [not_null]

  - name: fct_headway_regularity
    description: "Régularité des passages : intervalle médian, coefficient de variation, pourcentage de bunching (< 0,5 x médiane) et de trous (> 1,5 x médiane), par ligne, direction et heure locale."
    columns:
      - name: lineid
        data_tests: [not_null]
      - name: direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['City', 'Suburb']
      - name: cv
        data_tests: [not_null]