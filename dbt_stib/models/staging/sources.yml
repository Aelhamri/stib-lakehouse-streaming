version: 2

sources:
  - name: silver
    description: "Tables Silver produites par les jobs Spark (Delta, partitionné par jour de service)."
    tables:
      - name: positions_tracked
        description: "Positions avec tracklet_id, une ligne par observation valide."
        meta:
          external_location: "delta_scan('{{ env_var('SILVER_POSITIONS_PATH', '../data/delta/silver/positions_tracked') }}')"
          dagster:
            asset_key: ["silver_tracked"]