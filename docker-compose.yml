services:
  tests:
    build: .
    image: stib-lakehouse
    command: python -m pytest -q
    profiles: ["test"]

  dagster:
    build: .
    image: stib-lakehouse
    command: dagster dev -h 0.0.0.0 -p 3000 -f orchestration/definitions.py
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - dagster_home:/app/.dagster_home
    environment:
      DAGSTER_HOME: /app/.dagster_home

volumes:
  dagster_home: