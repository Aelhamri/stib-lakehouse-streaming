name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  dbt:
    runs-on: ubuntu-latest
    env:
      SILVER_POSITIONS_PATH: ../tests/fixtures/silver/positions_tracked
      DBT_DUCKDB_PATH: /tmp/stib_ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: dbt build --profiles-dir .
        working-directory: dbt_stib